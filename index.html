<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deck Dungeon</title>
<style>
  :root { --cw: min(96px, calc((100vw - 52px) / 5)); --gold: #ffd166; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #141022; }
  body { font: 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #f3eeff; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 1px 3px #000c; }
  #top { top: max(8px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; }
  #top small { font-weight: 600; opacity: .8; font-size: 12px; }
  #timer { flex: 1; max-width: 220px; height: 6px; border-radius: 3px; background: #ffffff22; overflow: hidden; }
  #timer i { display: block; height: 100%; width: 0; background: var(--gold); }
  #msg { top: 30%; left: 0; right: 0; text-align: center; font-size: 32px; font-weight: 900; opacity: 0; transition: opacity .3s; }
  #msg small { display: block; font-size: 15px; font-weight: 700; }
  #net { top: calc(max(8px, env(safe-area-inset-top)) + 22px); left: max(12px, env(safe-area-inset-left)); font-size: 12px; opacity: .75; }
  #panel { position: fixed; left: 0; right: 0; bottom: max(10px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 8px; }
  #panel[hidden], .ov[hidden], #ready[hidden] { display: none; }
  #bar { display: flex; align-items: center; justify-content: center; gap: 10px; width: min(560px, 100%); min-height: 44px; }
  #info { flex: 1; font-size: 13px; font-weight: 700; text-align: center; text-shadow: 0 1px 3px #000c; }
  #hand { display: flex; gap: 6px; align-items: flex-end; min-height: calc(var(--cw) * 1.38 + 14px); }
  .cd { position: relative; width: var(--cw); height: calc(var(--cw) * 1.38); box-sizing: border-box; padding: 14px 5% 5%; border-radius: 10px; border: 2px solid #ffffffcc; color: #fff;
        background: linear-gradient(165deg, var(--c1), var(--c2)); box-shadow: 0 3px 10px #0009; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 5px; text-align: center; cursor: pointer;
        font: inherit; transition: transform .18s, filter .18s, box-shadow .18s; }
  .cd.atk { --c1: #e8604a; --c2: #8a2032; } .cd.skl { --c1: #4f8fe8; --c2: #23407e; } .cd.ally { --c1: #42c487; --c2: #15654a; }
  .cd b.cost { position: absolute; top: -8px; left: -8px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: #ffd166; color: #3a2400; font-size: 15px; border: 2px solid #3a2400; }
  .cd .nm { font-weight: 900; font-size: calc(var(--cw) * .15); line-height: 1.05; text-shadow: 0 1px 2px #0008; }
  .cd .tx { font-size: calc(var(--cw) * .118); line-height: 1.12; opacity: .95; }
  .cd.on { transform: translateY(-14px); box-shadow: 0 0 0 3px var(--gold), 0 10px 18px #000a; }
  .cd.aim { transform: translateY(-14px) scale(1.04); box-shadow: 0 0 0 3px #fff, 0 0 22px #fff8; }
  .cd.no { filter: brightness(.55) saturate(.5); cursor: default; }
  .cd i.ord { position: absolute; top: -9px; right: -7px; width: 22px; height: 22px; border-radius: 50%; background: #fff; color: #222; font: 900 13px system-ui; display: grid; place-items: center; }
  #ready { min-width: 104px; min-height: 44px; border: 0; border-radius: 14px; background: var(--gold); color: #2a1a00; font: 900 15px system-ui, sans-serif; cursor: pointer; padding: 0 10px; }
  #ready.wait { background: #4a4266; color: #fff; }
  .ov { position: fixed; inset: 0; display: grid; place-items: center; background: #0d0a18b8; }
  .card { box-sizing: border-box; width: min(420px, calc(100vw - 24px)); max-height: 92vh; overflow: auto; padding: 18px; border-radius: 16px; background: #231c3a; border: 1px solid #ffffff26; text-align: center; }
  .card h2 { margin: 0 0 4px; font-size: 23px; color: var(--gold); } .card h3 { margin: 14px 0 4px; font-size: 13px; color: #b9a6ff; text-align: left; }
  .card p { margin: 6px 0; font-size: 14px; opacity: .85; }
  .card ol { margin: 0; padding-left: 24px; font-size: 14px; text-align: left; } .card li span { float: right; }
  .choices { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 14px 0 6px; }
  .shopc { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; font-weight: 800; color: var(--gold); }
  button.go { width: 100%; min-height: 48px; margin-top: 12px; border: 0; border-radius: 12px; background: var(--gold); color: #2a1a00; font: 800 16px system-ui, sans-serif; cursor: pointer; }
  button.alt { background: #3d3460; color: #fff; }
  button.svc { min-height: 44px; border: 1px solid #ffffff33; border-radius: 10px; background: #352c55; color: #fff; font: 700 13px system-ui, sans-serif; padding: 6px 10px; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  body.attract { --cw: 74px; } body.attract #bar { display: none; }
</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud" id="top"><span id="where"></span><div id="timer"><i></i></div><span id="purse"></span></div>
<div class="hud" id="msg"></div>
<div id="panel" hidden><div id="bar"><div id="info"></div><button id="ready">End turn</button></div><div id="hand"></div></div>
<div class="hud" id="net">Connecting…</div>
<div class="ov" id="reward" hidden><div class="card"><h2>Pick a card</h2><p id="rewardSub">It goes into your deck.</p><div class="choices" id="rewardCards"></div><button class="go alt" id="skip">Skip</button></div></div>
<div class="ov" id="shop" hidden><div class="card"><h2>The Wandering Shop</h2><p id="shopSub"></p><div class="choices" id="shopCards"></div>
  <div class="choices"><button class="svc" data-i="5">Heal 25% · 30◆</button><button class="svc" data-i="6">Remove a basic card · 50◆</button></div><button class="go" id="shopDone">Done shopping</button></div></div>
<div class="ov" id="over" hidden><div class="card">
  <h2 id="overTitle"></h2><p id="overSub"></p>
  <h3>Deepest floors</h3><ol id="board"><li>Loading…</li></ol>
  <button class="go" id="again">New run</button><p id="overNext"></p>
</div></div>
<script>
/* ═══ DECK DUNGEON · a Multiplayer Agent starter ═════════════════════════════════════
 * Build your deck, guard your friends, beat the Hollow King. Co-op, 1–4 players; bots play
 * every hero nobody has.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ timers, the cards, the four heroes and their decks, the monsters
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   MAP ........... the branching map, built from a seed on every client
 *   RULES ......... drawing cards, monster intents, resolving a turn into a log (plain functions)
 *   BOTS .......... how a bot plans its cards, votes, picks and shops
 *   HOST .......... seats and phases (map → fight → reward → map …, shop, rest, boss, over).
 *                   Only the host writes `run`, `fight` and `h0`…`h3`.
 *   ME ............ my plan for this turn, my vote, my card pick, my shopping
 *   SCENE ......... the battle (heroes, monsters, intents, the turn played back), the map
 *   PANEL & CARDS . the hand, the top bar, reward/shop/results cards, the leaderboard
 *   MAIN LOOP ..... heartbeat, host tick, drawing
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code, the HOST's browser runs the dungeon):
 *   - `run` (ONE shared JSON field, host-only): {id, v, sk (stage: goes up whenever players
 *     must choose again), ph: map|plan|act|reward|shop|rest|over, seed (the map), fl, node,
 *     path, at, end, seats [Knight, Cleric, Rogue, Mage] each {w: who ("" = bot), n, c},
 *     shop, won}. `v` goes up on every write; `end` is a timestamp.
 *   - `fight` (host): the monsters with their intents, the turn number, the bots' plans and
 *     the last turn's log (every client plays it back on the same clock).
 *   - `h0`…`h3` (host): each hero's hp, block, energy, gold and deck (draw pile, hand, discard).
 *   - Each player writes its OWN entity: `plan` {r: stage, c: [[card in hand, target]…], ok},
 *     `vote` {r, n: map node}, `pick` {r, i: reward card}, `done` {r} (left the shop),
 *     `n`/`c` (name, color) and `hb` (heartbeat). They live in state, so a new host sees them.
 *   - Intents to the host: "buy" {i} in the shop, "again" for a new run.
 *   - The host resolves a turn when every player is ready (or the timer ends: a bot plays
 *     for anyone who hasn't): skills first, then attacks, then the monsters.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "deepest-floor": the deepest floor each player's party reached (8 = won).
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  planMs: 40000,      // time to plan a turn before a bot plays for you
  stepMs: 450,        // how long each step of a turn takes to play back
  voteMs: 15000,      // time to vote on the next room
  rewardMs: 20000,    // time to pick a reward card
  shopMs: 30000,      // time in the shop
  restMs: 3500,       // the campfire pause
  resultsMs: 25000,   // the results show this long, then a new run starts
  energy: 3,          // energy every turn
  handSize: 5,        // cards drawn every turn
  restHeal: 0.35,     // share of max hp a rest gives back (and lifts the downed)
  fightGold: [14, 24], eliteGold: 40, // gold for each hero after a fight
  growth: 0.1,        // monsters get 10% more hp per floor...
  hitGrowth: 0.15,    // ...and hit 15% harder
  seatGraceMs: 10000, // a player silent this long hands its hero to a bot
  board: "deepest-floor",
};
// tg: who you aim at: enemy, ally (anyone up, you too), down (a downed ally), self, party (every hero), all (every monster).
const CARDS = {
  st: { n: "Strike", c: 1, tg: "enemy", dmg: 6, tx: "Deal 6" },
  df: { n: "Defend", c: 1, tg: "self", blk: 5, tx: "Block 5" },
  qj: { n: "Quick Jab", c: 0, tg: "enemy", dmg: 3, tx: "Deal 3" },
  ba: { n: "Bash", c: 2, tg: "enemy", dmg: 9, vu: 2, tx: "Deal 9. Vulnerable 2" },
  tc: { n: "Twin Cut", c: 1, tg: "enemy", dmg: 4, hits: 2, tx: "Deal 4 twice" },
  cl: { n: "Cleave", c: 1, tg: "all", dmg: 5, tx: "Deal 5 to every monster" },
  hb: { n: "Heavy Blow", c: 2, tg: "enemy", dmg: 16, tx: "Deal 16" },
  fb: { n: "Fireball", c: 2, tg: "all", dmg: 9, tx: "Deal 9 to every monster" },
  ex: { n: "Execute", c: 1, tg: "enemy", dmg: 5, ex: 20, tx: "Deal 5, or 20 if under 30% hp" },
  pd: { n: "Poison Dart", c: 1, tg: "enemy", ps: 5, tx: "Poison 5" },
  wn: { n: "Weaken", c: 1, tg: "enemy", wk: 2, tx: "Weak 2: hits 25% softer" },
  iw: { n: "Iron Wall", c: 2, tg: "self", blk: 13, tx: "Block 13" },
  sa: { n: "Shield Ally", c: 1, tg: "ally", blk: 8, tx: "A hero blocks 8" },
  ra: { n: "Rally", c: 1, tg: "party", blk: 4, tx: "Every hero blocks 4" },
  tt: { n: "Taunt", c: 1, tg: "self", blk: 6, taunt: 1, tx: "Block 6. Monsters hit only you" },
  md: { n: "Mend", c: 1, tg: "ally", heal: 8, tx: "Heal a hero 8" },
  sl: { n: "Sacred Light", c: 2, tg: "party", heal: 6, tx: "Heal every hero 6" },
  bc: { n: "Battle Cry", c: 1, tg: "party", str: 2, tx: "Every hero's attacks +2 this turn" },
  rv: { n: "Revive", c: 2, tg: "down", rv: 18, tx: "A downed hero gets up with 18 hp" },
};
// The four heroes: one seat each. pool = the cards their rewards come from.
const HEROES = [
  { n: "Knight", hp: 80, deck: ["st", "st", "st", "st", "df", "df", "df", "df", "tt"], pool: ["ba", "hb", "iw", "tt", "ra", "bc", "sa", "ex"], bot: "Sir Bram", color: "#5aa0ff" },
  { n: "Cleric", hp: 66, deck: ["st", "st", "st", "st", "df", "df", "df", "md", "sa"], pool: ["md", "sl", "sa", "ra", "rv", "bc", "wn", "qj"], bot: "Sister Ivy", color: "#ffd23f" },
  { n: "Rogue", hp: 62, deck: ["st", "st", "st", "st", "df", "df", "df", "tc", "pd"], pool: ["tc", "pd", "qj", "ex", "wn", "ba", "cl"], bot: "Nim", color: "#52d273" },
  { n: "Mage", hp: 60, deck: ["st", "st", "st", "st", "df", "df", "df", "cl", "wn"], pool: ["fb", "cl", "wn", "pd", "hb", "bc", "ex"], bot: "Orla", color: "#c77dff" },
];
// moves: what a monster does, in turn: [kind, amount, hits]. atk/aoe hurt, blk blocks, buf = stronger for good, wk/wka = Weak on one hero / every hero.
const FOES = {
  slime: { n: "Slime", hp: 28, moves: [["atk", 9], ["blk", 6], ["atk", 12]] },
  goblin: { n: "Goblin", hp: 22, moves: [["atk", 5, 2], ["atk", 9]] },
  cultist: { n: "Cultist", hp: 34, moves: [["buf", 3], ["atk", 8], ["atk", 9]] },
  golem: { n: "Stone Golem", hp: 48, moves: [["blk", 12], ["atk", 14], ["aoe", 6]] },
  bat: { n: "Bat", hp: 15, moves: [["atk", 4, 3], ["wk", 2]] },
  warlord: { n: "Orc Warlord", hp: 95, moves: [["atk", 18], ["aoe", 9], ["buf", 3]], big: 1 },
  king: { n: "The Hollow King", hp: 340, moves: [["aoe", 12], ["atk", 26], ["wka", 2], ["blk", 20], ["atk", 9, 3], ["buf", 3]], big: 2 },
};
const COLORS = ["#ff6b6b", "#4da6ff", "#ffd23f", "#52d273", "#c77dff", "#ff8c42", "#ff6fb5", "#3de0d0"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'deck-dungeon',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");
if (ATTRACT) Object.assign(CONFIG, { planMs: 1700, stepMs: 330, voteMs: 600, rewardMs: 600, shopMs: 600, restMs: 600, resultsMs: 1500 });

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
let net = null, S = { entities: { players: {} }, shared: {} }, joinedAt = 0;
const memo = new Map();
/** A JSON value from state, parsed once per change (read-only: never mutate what this returns). */
function parseOnce(key, raw, fallback) {
  const m = memo.get(key);
  if (m && m.raw === raw) return m.v;
  const v = parse(raw, fallback); memo.set(key, { raw, v }); return v;
}
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let frameAt = 0, wokeAt = -1e9; // my loop's last frame, and when it last woke from a stall (a frozen or background tab)
/** Never while my own loop is stalled, nor for 0.7s after it wakes: the room moved on without me, so the newer state lands first. */
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() - frameAt < 1000 && performance.now() - wokeAt > 700;
const stillHere = (id) => id === net.sessionId || (!!S.entities.players[id] && performance.now() - (seenHb.get(id)?.at ?? -1e9) < CONFIG.seatGraceMs);
const hostCopy = {}; // the host's own latest writes, until they come back in state
/** A host-written shared JSON field: the state's copy, or the host's newer write. `v` only goes up. */
function sv(key) {
  const s = parseOnce("s:" + key, S.shared[key], null), h = hostCopy[key];
  return h && isHost() && (!s || h.v > s.v) ? h : s;
}
function write(key, o) {
  o = { ...o, v: Math.max(hostCopy[key]?.v ?? 0, parseOnce("s:" + key, S.shared[key], null)?.v ?? 0) + 1 };
  hostCopy[key] = o; net.setShared(key, JSON.stringify(o)); return o;
}
const heroesNow = () => [0, 1, 2, 3].map((k) => sv("h" + k));
const mine = (field) => parseOnce("me:" + field, S.entities.players[net.sessionId]?.[field], null);
const theirs = (id, field) => parseOnce(id + ":" + field, S.entities.players[id]?.[field], null);

// ── MAP ─────────────────────────────────────────────────────────────────────────────
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const ROWS = 6; // rooms before the boss; node index = row * 3 + column, the boss is node 18
let mapCache = null;
/** The map from its seed: 6 rows of 3 rooms (fight, elite, shop, rest), then the boss. Same on every client. */
function mapOf(seed) {
  if (mapCache && mapCache.seed === seed) return mapCache;
  const r = mulberry32(seed), nodes = [];
  for (let row = 0; row < ROWS; row++) for (let c = 0; c < 3; c++) {
    const x = r();
    const t = row === 0 || (c === 1 && row < ROWS - 1 && x < 0.7) ? "fight" : row === ROWS - 1 ? (c === 1 ? "shop" : "rest") : x < 0.5 ? "fight" : x < 0.66 && row >= 2 ? "elite" : x < 0.8 ? "shop" : x < 0.92 ? "rest" : "fight"; // the middle lane is mostly fights
    nodes.push({ row, c, t });
  }
  nodes.push({ row: ROWS, c: 1, t: "boss" });
  return (mapCache = { seed, nodes });
}
/** Where the party can go next from node n (-1 = the entrance). */
function nextNodes(n) {
  if (n < 0) return [0, 1, 2];
  if (n >= (ROWS - 1) * 3 && n < ROWS * 3) return [ROWS * 3];
  if (n >= ROWS * 3) return [];
  const row = Math.floor(n / 3), c = n % 3;
  return [c - 1, c, c + 1].filter((x) => x >= 0 && x < 3).map((x) => (row + 1) * 3 + x);
}

// ── RULES ───────────────────────────────────────────────────────────────────────────
const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const upHeroes = (H) => H.map((h, k) => k).filter((k) => H[k] && !H[k].dn);
/** Draw n cards: from the draw pile, reshuffling the discards into it when it runs out. */
function drawCards(h, n) {
  for (let i = 0; i < n; i++) {
    if (!h.draw.length) { h.draw = shuffle(h.disc); h.disc = []; }
    if (!h.draw.length) return;
    h.hand.push(h.draw.pop());
  }
}
function newHero(k) {
  const Hh = HEROES[k], deck = Hh.deck.slice();
  if (ATTRACT) deck.push(...[["hb", "iw"], ["sl", "rv"], ["tc", "ex"], ["fb", "pd"]][k]); // a deeper deck for the preview
  return { hp: Hh.hp, mhp: Hh.hp, blk: 0, en: CONFIG.energy, gold: 30, dn: 0, str: 0, wk: 0, vu: 0, deck, draw: [], disc: [], hand: [], offer: [], bought: [] };
}
/** The monsters for a room on floor fl. */
function makeFoes(kind, fl) {
  const pick = (list) => list[Math.floor(Math.random() * list.length)];
  const types = kind === "boss" ? ["bat", "king", "bat"] : kind === "elite" ? ["warlord", "goblin"]
    : fl <= 1 ? [pick(["slime", "goblin", "bat"]), pick(["slime", "goblin"])]
    : fl <= 3 ? Array.from({ length: rint(2, 3) }, () => pick(["slime", "goblin", "cultist", "bat", "golem"]))
    : [pick(["cultist", "golem"]), pick(["goblin", "bat", "slime"]), pick(["cultist", "golem", "goblin"])];
  return types.map((t) => { const hp = Math.round(FOES[t].hp * (FOES[t].big === 2 ? 1 : 1 + CONFIG.growth * fl)); /* the boss is the same every run */ return { t, hp, mhp: hp, blk: 0, str: 0, wk: 0, vu: 0, ps: 0, mi: rint(0, 5), it: null }; });
}
/** A monster's next move, aimed at a random hero who is up: [kind, amount, hits, target seat]. */
function nextIntent(e, H, fl) {
  const M = FOES[e.t].moves[e.mi % FOES[e.t].moves.length], up = upHeroes(H);
  e.mi++;

  net.on("again", () => { if (isHost()) host.again = true; });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  joinedAt = performance.now();
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...HEROES.map((Hh) => Hh.color)]);
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  requestAnimationFrame(frame);
})();
</script>
